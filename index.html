<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi HRD Gedo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: white; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 100%; max-width: 420px; padding: 30px; text-align: center; }
        h1 { color: #1a73e8; font-size: 22px; margin-bottom: 6px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 25px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #1a73e8; color: white; }
        .btn-primary:hover { background: #1557b0; transform: translateY(-2px); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        select, input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; margin-bottom: 15px; }
        select:focus, input:focus { outline: none; border-color: #1a73e8; }
        .qr-container { margin: 20px 0; padding: 15px; background: #f8f9fa; border-radius: 12px; display: none; }
        .qr-container img { max-width: 260px; width: 100%; border-radius: 8px; }
        .time { font-size: 18px; font-weight: bold; color: #333; margin: 10px 0; }
        .status { font-size: 13px; color: #666; margin-top: 8px; }
        .loading { display: inline-block; width: 20px; height: 20px; border: 3px solid #ddd; border-top-color: #1a73e8; border-radius: 50%; animation: spin 1s linear infinite; margin-left: 8px; vertical-align: middle; }
        .hidden { display: none !important; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Absensi HRD Gedo</h1>
        <p class="subtitle">QR Code Attendance System</p>

        <!-- Halaman Pilih Outlet -->
        <div id="page-select">
            <label style="display:block; text-align:left; font-weight:600; margin-bottom:8px; color:#333;">Pilih Outlet</label>
            <select id="officeSelect">
                <option value="">Memuat daftar outlet...</option>
            </select>
            
            <label style="display:block; text-align:left; font-weight:600; margin-bottom:8px; color:#333;">Masukkan PIN</label>
            <input type="password" id="pinInput" placeholder="Masukkan PIN Outlet">
            
            <button class="btn btn-primary" id="showQrBtn">Tampilkan QR Code</button>
        </div>

        <!-- Halaman QR -->
        <div id="page-qr" class="hidden">
            <h2 id="officeName" style="color:#333; font-size:18px; margin-bottom:10px;"></h2>
            <div class="time" id="currentTime">--:--:--</div>
            
            <div class="qr-container" id="qrContainer" style="display:block;">
                <img id="qrImage" src="" alt="QR Code">
                <p class="status" id="qrStatus">Memuat QR Code...</p>
            </div>
            
            <p class="status">🔄 QR diperbarui otomatis setiap 3 detik</p>
            <button class="btn btn-primary" style="margin-top:20px; background:#666;" id="backBtn">Kembali</button>
        </div>
    </div>

    <script>
        const API_BASE = '/api/proxy?path=';
        let qrRefreshTimer = null;
        let officeList = [];
        let currentOfficeId = null;

        // === PRE-FETCH: Ambil daftar outlet SEKARANG saat halaman dimuat ===
        window.addEventListener('load', () => {
            loadOffices();
            updateTime();
            setInterval(updateTime, 1000);
        });

        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleTimeString('id-ID', { hour12: false });
        }

        async function loadOffices() {
            try {
                const res = await fetch(`${API_BASE}?ajaxoffices=1`);
                const text = await res.text();
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                const options = doc.querySelectorAll('option');
                
                const select = document.getElementById('officeSelect');
                select.innerHTML = '<option value="">-- Pilih Outlet --</option>';
                officeList = [];
                
                options.forEach(opt => {
                    if (opt.value) {
                        select.innerHTML += `<option value="${opt.value}">${opt.textContent}</option>`;
                        officeList.push({ id: opt.value, name: opt.textContent });
                    }
                });
            } catch (err) {
                document.getElementById('officeSelect').innerHTML = '<option value="">Gagal memuat outlet</option>';
                console.error('Load offices error:', err);
            }
        }

        document.getElementById('showQrBtn').addEventListener('click', async () => {
            const officeId = document.getElementById('officeSelect').value;
            const officeName = document.getElementById('officeSelect').selectedOptions[0]?.text;
            const pin = document.getElementById('pinInput').value.trim();
            
            if (!officeId) return alert('Pilih outlet dulu!');
            if (!pin) return alert('Masukkan PIN dulu!');
            
            currentOfficeId = officeId;
            
            document.getElementById('page-select').classList.add('hidden');
            document.getElementById('page-qr').classList.remove('hidden');
            document.getElementById('officeName').textContent = officeName;
            document.getElementById('qrStatus').textContent = 'Memuat QR Code...';
            
            loadQR(officeId, pin);
            qrRefreshTimer = setInterval(() => loadQR(officeId, pin), 3000);
        });

        async function loadQR(officeId, pin) {
            try {
                const qrUrl = `${API_BASE}?ajaxverifyoffice=${encodeURIComponent(officeId)}&pin=${encodeURIComponent(pin)}`;
                const res = await fetch(qrUrl, { cache: 'no-store' });
                const html = await res.text();
                
                if (html.trim() === '0') {
                    document.getElementById('qrStatus').textContent = '❌ PIN salah';
                    document.getElementById('qrImage').src = '';
                    stopQRRefresh();
                    return;
                }
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const img = doc.querySelector('img');
                
                if (img && img.src) {
                    document.getElementById('qrImage').src = img.src + '&t=' + Date.now();
                    document.getElementById('qrStatus').textContent = '✅ Aktif — terakhir: ' + new Date().toLocaleTimeString('id-ID');
                } else {
                    document.getElementById('qrStatus').textContent = '⚠️ QR tidak ditemukan, coba lagi';
                }
            } catch (err) {
                document.getElementById('qrStatus').textContent = '🔄 Menyambungkan ulang...';
                console.error('QR load error:', err);
            }
        }

        function stopQRRefresh() {
            if (qrRefreshTimer) {
                clearInterval(qrRefreshTimer);
                qrRefreshTimer = null;
            }
        }

        document.getElementById('backBtn').addEventListener('click', () => {
            stopQRRefresh();
            document.getElementById('page-select').classList.remove('hidden');
            document.getElementById('page-qr').classList.add('hidden');
            document.getElementById('pinInput').value = '';
            document.getElementById('qrImage').src = '';
            currentOfficeId = null;
        });
    </script>
</body>
</html>
